id: semantiscan/query
name: Semantiscan RAG Query
version: 1.0.0
description: Semantic search and retrieval via semantiscan.
tags: [semantiscan, rag, search]
risk_level: low
permissions: [network]
requires_approval: false
commands:
  - name: search
    summary: Search the semantiscan index for relevant passages.
    risk_level: low
    requires_approval: false
    params:
      - name: query
        type: string
        required: true
        description: Natural language search query
      - name: top_k
        type: integer
        required: false
        default: 5
        description: Number of results to return
      - name: namespace
        type: string
        required: false
        description: Restrict search to a namespace
    returns:
      type: array
      properties:
        items:
          type: object
          properties:
            chunk_id: {type: string}
            score: {type: number}
            text: {type: string}
    execution_target: remote
  - name: ingest
    summary: Ingest a document or codebase into the semantiscan index.
    risk_level: medium
    requires_approval: false
    params:
      - name: source
        type: string
        required: true
        description: Path or URL to ingest
      - name: namespace
        type: string
        required: false
    execution_target: local
mappings:
  semantiscan.api_method: search
